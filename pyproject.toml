[project]
name = "viral-song"
version = "0.1.0"
description = "ML Pro 1 HW"
requires-python = ">=3.11, <3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn >=1.6, <1.7",
    "joblib",
    "psycopg[binary]",
    "catboost"
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff"
]

jupyter = [
    "jupyter",
    "matplotlib",
    "seaborn",
    "ipykernel",
    "openpyxl"
]

[build-system]
requires = ["uv_build >= 0.10, <0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
model-name = "viral-song"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: нужна база данных - адрес в DATABASE_URL"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]