apiVersion: apps/v1
kind: Deployment
metadata:
  name: viral-song-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: viral-song
  template:
    metadata:
      labels:
        app: viral-song
    spec:
      containers:
        - name: api
          image: viral-song-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: viral-song-config}
            - secretRef: {name: viral-song-service}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}